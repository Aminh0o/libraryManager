name: Release

# Cut a GitHub Release, build the Windows bundle, upload it as an asset,
# and stamp a SHA-256 checksum file — every time a version tag is pushed.
#
# To publish a new release:
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Or trigger manually (for a re-cut) from the Actions tab.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to re-cut (e.g. v1.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Regenerate localisations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Test suite
        run: flutter test --no-pub

      - name: Build release
        run: flutter build windows --release

      - name: Determine tag / version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") {
            "${{ github.event.inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          "tag=$tag"        | Out-File -Encoding utf8 $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" | Out-File -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Zip the bundle
        shell: pwsh
        run: |
          $staging = "staging"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Recurse "build/windows/x64/runner/Release/*" $staging
          $zip = "LibraryManager-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -CompressionLevel Optimal
          "ZIP=$zip" | Out-File -Encoding utf8 $env:GITHUB_ENV

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "$env:ZIP" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ZIP" | Out-File -Encoding ascii -NoNewline "${env:ZIP}.sha256sum"
          Get-Content "${env:ZIP}.sha256sum"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Library Manager ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256sum
          body: |
            ## Library Manager ${{ steps.version.outputs.version }}

            Portable Windows x64 bundle. Unzip to any folder, run
            `library_manager.exe`. No installer, no admin rights needed.

            ### Verify the download

            ```powershell
            (Get-FileHash .\${{ env.ZIP }} -Algorithm SHA256).Hash.ToLower()
            ```

            Should match the first column of `${{ env.ZIP }}.sha256sum`.

            ### Migration notes

            See [`CHANGELOG.md`](../main/CHANGELOG.md#${{ steps.version.outputs.version }}).
